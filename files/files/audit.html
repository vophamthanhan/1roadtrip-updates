<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>1Roadtrip Privacy Audit</title>
  <link rel="stylesheet" href="audit.css" />
</head>
<body>
  <main>
    <header>
      <div class="logo">1R</div>
      <div><p>1ROADTRIP EXTENSION</p><h1>Local Privacy Audit</h1></div>
      <button id="refreshBtn">Run again</button>
    </header>
    <section class="summary">
      <div><p>PROFILE STATUS</p><strong id="profileStatus">Checking…</strong></div>
      <div><p>CHECKED LOCALLY</p><strong id="checkedAt">—</strong></div>
    </section>
    <p class="notice">This report does not contact an IP checker, analytics service or built-in third party. It audits settings that Chrome exposes to this extension.</p>
    <section id="results" class="results" aria-live="polite"></section>
  </main>
  <script src="audit.js"></script>
</body>
</html>
